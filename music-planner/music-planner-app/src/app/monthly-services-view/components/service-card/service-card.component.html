<mat-card class="service-card">
  <mat-card-header>
    <div class="header-text">
      <mat-card-title>{{ service.serviceDate }}</mat-card-title>
      <mat-card-subtitle>{{ service.serviceType }}</mat-card-subtitle>
    </div>
    <button
      mat-stroked-button
      class="edit-button"
      type="button"
      [disabled]="swapping"
      (click)="editRequested.emit(service)"
    >Edit</button>
  </mat-card-header>
  <mat-card-content>
    <div
      cdkDropList
      [id]="'service-' + service.id"
      [cdkDropListData]="service.serviceSlots"
      cdkDropListSortingDisabled
    >
      <div class="slot-group" *ngFor="let group of service.slotGroups">
        <div class="category-label">{{ group.category }}</div>
        <app-slot-item
          *ngFor="let slot of group.slots"
          [slot]="slot"
          [conflict]="conflictMap[slot.id] ?? null"
          [disabled]="swapping"
          [dropTarget]="slot.id === hoverSlotId"
          (slotDragMoved)="slotDragMoved.emit($event)"
          (slotDropped)="slotDropped.emit($event)"
        ></app-slot-item>
      </div>
    </div>
  </mat-card-content>
</mat-card>
