<div class="slot-item" [class]="conflictClass" [attr.data-slot-id]="slot.id" [class.drop-target]="dropTarget" cdkDrag (cdkDragMoved)="onDragMoved($event)" (cdkDragEnded)="onDragEnded($event)" [cdkDragData]="slot" [cdkDragDisabled]="disabled" [matTooltip]="tooltipText">
  <span class="slot-label">{{ slot.slotLabel }}</span>
  <span class="slot-song" *ngIf="slot.hymnDisplayText !== null; else emptySlot">{{ slot.hymnDisplayText }}</span>
  <ng-template #emptySlot>
    <span class="slot-song empty-placeholder">Empty</span>
  </ng-template>
</div>
