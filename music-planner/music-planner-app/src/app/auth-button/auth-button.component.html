<span class="auth-control">
  <!-- Loading_State: suppress both actions (Req 1.2) -->
  <mat-progress-spinner
    *ngIf="isLoading$ | async"
    diameter="20"
    mode="indeterminate"
    aria-label="Authenticating"
  ></mat-progress-spinner>

  <ng-container *ngIf="!(isLoading$ | async)">
    <!-- Unauthenticated_State (Req 1.3, 2.2, 2.3) -->
    <button
      *ngIf="!(isAuthenticated$ | async)"
      mat-button
      type="button"
      (click)="login()"
      [disabled]="loginInProgress"
    >
      Log In
    </button>

    <!-- Authenticated_State (Req 1.4, 3.2, 3.3, 4.1-4.4) -->
    <ng-container *ngIf="isAuthenticated$ | async">
      <span class="user-identifier" *ngIf="userIdentifier$ | async as name">{{ name }}</span>
      <button mat-button type="button" (click)="logout()">Log Out</button>
    </ng-container>
  </ng-container>
</span>
